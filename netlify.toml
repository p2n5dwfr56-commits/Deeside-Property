# Netlify: build the app and publish the dist folder. No secrets are needed for this version.
[build]
  command = "npm ci && npm test && npm run build"
  publish = "dist"
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
