# Deeside Property Watch: read the myASPC alert emails, compare with what is known, record changes, publish to the website.
# Run on demand: Actions tab > "Collect listings" > Run workflow. Runs by itself every day at about 09:23 UK time
# (after myASPC's morning round-up). Secrets (Settings > Secrets and variables > Actions):
#   IMAP_USER, IMAP_PASSWORD  the mailbox that receives the myASPC emails (Gmail address and its app password)
#   DPW_PASSPHRASE            encrypts the database and the website's data file (the repository is public)
# The Aberdein Considine website collector is still available by ticking its box when running by hand.
name: Collect listings
on:
  workflow_dispatch:
    inputs:
      agent_site:
        description: 'Also read the Aberdein Considine website'
        type: boolean
        default: false
  schedule:
    - cron: '23 8 * * *'
  push:
    branches: ['claude/simple-collector']
    paths: ['collector/collect.py', '.github/workflows/collect.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: collect-listings
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DPW_PASSPHRASE: ${{ secrets.DPW_PASSPHRASE }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
      IMAP_HOST: ${{ vars.IMAP_HOST }}
      IMAP_FOLDER: ${{ vars.IMAP_FOLDER }}
      ENC: -aes-256-cbc -pbkdf2 -iter 200000 -md sha256
    outputs:
      saved: ${{ steps.save.outputs.saved }}
    steps:
      - uses: actions/checkout@v4
      - name: Load the previous database (encrypted, branch collector-data)
        if: env.DPW_PASSPHRASE != ''
        run: |
          if git fetch -q origin collector-data 2>/dev/null; then
            git show FETCH_HEAD:deeside.db.enc > /tmp/db.enc
            openssl enc -d $ENC -in /tmp/db.enc -out collector/deeside.db -pass env:DPW_PASSPHRASE
            echo "Previous database loaded."
          else
            echo "No previous database: this is the first run."
          fi
      - name: Read the myASPC alert emails
        if: env.IMAP_USER != '' && env.IMAP_PASSWORD != ''
        run: python3 collector/mailbox.py --db collector/deeside.db --days 14
      - name: Note when no mailbox is set up
        if: env.IMAP_USER == '' || env.IMAP_PASSWORD == ''
        run: echo "::warning::IMAP_USER / IMAP_PASSWORD are not set, so no alert emails were read."
      - name: Read the Aberdein Considine website (only when ticked, or on the development branch)
        if: inputs.agent_site || github.event_name == 'push'
        run: python3 collector/collect.py --db collector/deeside.db
      - name: Export for the website
        run: python3 collector/export.py --db collector/deeside.db --out collected.json
      - name: Save the database (encrypted)
        id: save
        if: env.DPW_PASSPHRASE != ''
        run: |
          mkdir -p /tmp/out && cd /tmp/out && git init -q && git checkout -q -b collector-data
          if git -C "$GITHUB_WORKSPACE" fetch -q origin collector-data 2>/dev/null; then git fetch -q "$GITHUB_WORKSPACE" FETCH_HEAD && git reset -q --soft FETCH_HEAD; fi
          openssl enc $ENC -salt -in "$GITHUB_WORKSPACE/collector/deeside.db" -out deeside.db.enc -pass env:DPW_PASSPHRASE
          git add deeside.db.enc
          git -c user.name=collector -c user.email=collector@users.noreply.github.com commit -qm "Collection $(date -u +%FT%TZ)"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" collector-data
          echo "saved=yes" >> "$GITHUB_OUTPUT"
      - name: Note when nothing was saved
        if: env.DPW_PASSPHRASE == ''
        run: echo "::warning::DPW_PASSPHRASE is not set, so this run only counted listings. Nothing was saved or published."
      - name: Encrypt the website's data file
        if: env.DPW_PASSPHRASE != ''
        run: openssl enc $ENC -salt -in collected.json -out collected.enc -pass env:DPW_PASSPHRASE
      - uses: actions/upload-artifact@v4
        if: env.DPW_PASSPHRASE != ''
        with: { name: collected-enc, path: collected.enc, retention-days: 2 }

  website:
    needs: collect
    if: needs.collect.outputs.saved == 'yes' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env: { VITE_COLLECTED: '1' }
      - uses: actions/download-artifact@v4
        with: { name: collected-enc, path: dist }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4
