# One-off: run a real collection and save the full results ENCRYPTED for review (see tools/verify/verify.sh).
name: Verify a real collection
on:
  push:
    branches: ['claude/simple-collector']
    paths: ['tools/verify/**']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: tools/verify/verify.sh
      - name: Save the encrypted results to the branch verify-out
        run: |
          blob1=$(git hash-object -w verify.tgz.enc); blob2=$(git hash-object -w verify.key.enc)
          tree=$(printf '100644 blob %s\tverify.key.enc\n100644 blob %s\tverify.tgz.enc\n' "$blob2" "$blob1" | git mktree)
          commit=$(git -c user.name=verify -c user.email=verify@users.noreply.github.com commit-tree "$tree" -m "Verification $(date -u +%FT%TZ)")
          git push -qf origin "$commit:refs/heads/verify-out"
